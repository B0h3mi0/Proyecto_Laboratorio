
# ===============================
# CONFIGURACION GENERAL DEL SERVIDOR
# ===============================
server:
  port: 8081
  servlet:
    context-path: /api  # opcional, para definir prefijo en las rutas

# ===============================
# CONFIGURACION DE LA BASE DE DATOS POSTGRES
# ===============================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # facilitar pruebas; ajustar en prod
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Control de perfiles (opcional)
#profiles:
#  active: dev


# ===============================
# CONFIGURACION DE LOGGING
# ===============================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  file:
    name: logs/app.log  # Guarda logs en un archivo local

# ===============================
# CONFIGURACION PERSONALIZADA
# ===============================
app:
  nombre: "Servicio de Gestion de Laboratorios"
  version: "1.0.0"
  descripcion: "API REST con Spring Boot, Oracle y JWT"